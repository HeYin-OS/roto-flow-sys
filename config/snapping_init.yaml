snapping:
  theta: 0.1
  alpha: 0.1
  beta: 0.5
  beta_shift: 0.2
  sigma_c: 1.0
  sigma_s: 1.6
  sigma_m: 3.0
  rho: 0.99
  x: 4
  y: 7
  r_s: 20
  candidate_num: 4
  sampling_num: 100
  average_weight_threshold: 0.07
  lambda_shape: 0.1  # 形状约束项的权重（控制形变程度）
  lambda_topology: 0.15  # 拓扑顺序项的权重（保持拓扑逻辑）
  lambda_deform: 1.2  # 形变项的权重（增强形变控制）
  lambda_velocity: 0.8  # 速度约束项的权重（防止过大的位移，保持时间连续性，强化版）- 增强以抑制摆动
  lambda_length: 0.5  # 长度约束项的权重（控制整体polyline长度的变化）- 增强以严格控制长度