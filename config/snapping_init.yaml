snapping:
  theta: 0.1
  alpha: 0.1
  beta: 0.5
  beta_shift: 0.2
  sigma_c: 1.0
  sigma_s: 1.6
  sigma_m: 3.0
  rho: 0.99
  x: 4
  y: 7
  r_s: 20
  candidate_num: 4
  sampling_num: 100
  average_weight_threshold: 0.07
  lambda_shape: 0.0  # 形状约束项的权重（已禁用，仅保留核心算法）
  lambda_topology: 0.0  # 拓扑顺序项的权重（已禁用，仅保留核心算法）
  lambda_deform: 1.0  # 形变项的权重（使用论文原始值）
  lambda_velocity: 0.0  # 速度约束项的权重（已禁用，仅保留核心算法）
  lambda_length: 0.0  # 长度约束项的权重（已禁用，仅保留核心算法）