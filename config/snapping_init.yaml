snapping:
  # ========== 边缘检测参数 ==========
  theta: 0.1  # 边缘检测阈值，用于过滤局部最大值点（compute_all_candidates）
  
  # ========== FDoG滤波器参数 ==========
  sigma_c: 1.0  # FDoG核中心高斯的标准差
  sigma_s: 1.6  # FDoG核周围高斯的标准差
  sigma_m: 3.0  # 沿v方向高斯平滑的标准差
  rho: 0.99  # FDoG核的权重系数
  x: 4  # FDoG核u方向（x方向）的最大范围，映射为X_MAX
  y: 7  # 高斯核v方向（y方向）的最大范围，映射为Y_MAX
  
  # ========== 能量函数权重参数 ==========
  alpha: 0.1  # FDoG响应项（tilde_H_response）的权重系数
  lambda_deform: 1.0  # 形变项的权重，控制形变惩罚的强度
  lambda_crossing: 0.0  # 交叉惩罚项的权重，惩罚尖角转折（>150度），从而避免交叉（已禁用）
  # lambda_shape: 0.0  # 形状约束项的权重（已禁用，仅保留核心算法）
  # lambda_topology: 0.0  # 拓扑顺序项的权重（已禁用，仅保留核心算法）
  # lambda_velocity: 0.0  # 速度约束项的权重（已禁用，仅保留核心算法）
  # lambda_length: 0.0  # 长度约束项的权重（已禁用，仅保留核心算法）
  
  # ========== 候选点搜索参数 ==========
  r_s: 20  # 候选点搜索半径，用于KD树查询和形变项归一化
  
  # ========== 路径选择参数 ==========
  average_weight_threshold: 0.07  # 平均能量阈值，用于pick_best_path判断路径是否可接受
  
  # ========== 拓扑修复参数 ==========
  enable_topology_fix: true  # 是否启用拓扑修复（交叉检测、方向重排、删除过近点、插入点到过长边等）
  max_stroke_points: 200  # stroke的最大点数限制，超过此值会进行降采样
  
  # ========== Mask过滤参数 ==========
  erode_size: 2  # Mask腐蚀厚度（像素），表示从边界向内侵蚀的像素数，用于过滤物体内部的候选点
  dilate_size: 2  # Mask膨胀厚度（像素），表示从边界向外扩展的像素数，用于过滤物体外部的候选点
  flow_erode_size: 2  # 光流截取时Mask腐蚀厚度（像素），表示从边界向内侵蚀的像素数
  flow_dilate_size: 2  # 光流膨胀厚度（像素），表示从有效光流区域向外扩展的像素数
  
  # ========== 导出参数 ==========
  export_crop_ratio: 0.4  # PNG导出时的裁剪比例，从中心裁剪（0.5表示裁剪0.5H*0.5W的区域）
  export_crop_offset_y: -0.3  # Y方向偏移比例（相对于图像高度，负数向上，正数向下，0为中心）
  export_crop_offset_x: 0.0  # X方向偏移比例（相对于图像宽度，负数向左，正数向右，0为中心）